# Bind only to 127.0.0.1 and port 8080 as required
server.address=127.0.0.1
server.port=8080

# Logging configuration (redact / disable sensitive body logs)
logging.level.org.springframework.web=INFO
logging.level.com.adamtts=DEBUG

# Application Custom Properties
app.data-dir=./data
app.ffmpeg-path=ffmpeg
app.ffprobe-path=ffprobe
app.elevenlabs.base-url=https://api.elevenlabs.io
app.elevenlabs.default-voice-id=pNInz6obpgDQGcFmaJgB

# Multipart and request limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

